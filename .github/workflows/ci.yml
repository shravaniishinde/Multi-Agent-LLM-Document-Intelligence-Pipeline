name: CI

# Everything here runs offline (mock OCR, fake LLM, in-memory vector store):
# no Pinecone, LLM, AWS or other private credentials are needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run demo (smoke test)
        run: python scripts/demo_pipeline.py inv_004 inv_005

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t doc-intel-pipeline:ci .

      - name: Start container and call the API
        run: |
          docker run -d --name api -p 8000:8000 doc-intel-pipeline:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/documents/process \
            -H 'Content-Type: application/json' -d '{"document_id": "inv_001"}' \
            | grep -q '"decision":"APPROVE"'
          curl -fsS http://127.0.0.1:8000/metrics

      - name: Container logs
        if: always()
        run: docker logs api || true

  # Optional: trigger a Render deploy from main when the hook secret is configured.
  deploy:
    name: Deploy (Render hook)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL not set - skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
