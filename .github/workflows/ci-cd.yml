name: CI → CD (Document Intelligence Pipeline)

on:
  push:
    branches: [main]

jobs:
  # -------------------
  # 1️⃣ CI JOB
  # -------------------
  test:
    name: CI - Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The suite runs fully offline (mock OCR, fake LLM, in-memory vector
      # store), so no API keys or system packages are needed.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  # -------------------
  # 2️⃣ CD JOB
  # -------------------
  deploy:
    name: CD - Deploy to Render
    runs-on: ubuntu-latest

    # 🚨 CD runs ONLY if CI passes
    needs: test

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set"
            exit 1
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
